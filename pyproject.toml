[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kinbase-design"
dynamic = ["version"]
description = "Local design language library and visual workbench"
requires-python = ">=3.12"
dependencies = ["jinja2", "rfc8785", "fonttools", "pillow", "playwright"]

[project.scripts]
kinbase-design = "kinbase_design.cli:main"

[tool.setuptools.packages.find]
include = ["kinbase_design*"]

[tool.setuptools.package-data]
kinbase_design = ["workbench/templates/*.html", "workbench/*.css", "render/*.css", "checks/*.js", "artifacts/*.js", "checks/vendor/*"]

[tool.setuptools.dynamic]
version = {attr = "kinbase_design.__version__"}
